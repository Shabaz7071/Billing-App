<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garment Wholesale Billing</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2canvas and jsPDF for exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- LEFT SIDE: INPUT FORM -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Create New Bill</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Purchaser Name</label>
                    <input type="text" id="purchaser" class="w-full p-3 border border-gray-300 rounded text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter customer name">
                </div>

                <div>
                    <label class="block text-gray-700 font-bold mb-2">Item Name</label>
                    <input type="text" id="item" class="w-full p-3 border border-gray-300 rounded text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Cotton Shirts Batch">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Quantity (Pcs)</label>
                        <input type="number" id="qty" class="w-full p-3 border border-gray-300 rounded text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" min="1">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Price per Pc (₹)</label>
                        <input type="number" id="price" class="w-full p-3 border border-gray-300 rounded text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00" min="0">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Additional Charges</label>
                        <select id="chargeType" class="w-full p-3 border border-gray-300 rounded text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="None">None</option>
                            <option value="Parcel Charges">Parcel Charges</option>
                            <option value="Transport">Transport</option>
                            <option value="Packaging">Packaging</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Charge Amount (₹)</label>
                        <input type="number" id="chargeAmount" class="w-full p-3 border border-gray-300 rounded text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00" min="0">
                    </div>
                </div>

                <button onclick="generateBill()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded text-xl transition duration-200">
                    Preview Bill
                </button>
            </div>
        </div>

        <!-- RIGHT SIDE: BILL PREVIEW & EXPORT -->
        <div class="flex flex-col gap-4">
            
            <!-- Controls -->
            <div id="export-controls" class="hidden bg-white p-4 rounded-lg shadow-md flex gap-4">
                <button onclick="downloadImage()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded text-lg transition duration-200">
                    Download Image
                </button>
                <button onclick="downloadPDF()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded text-lg transition duration-200">
                    Download PDF
                </button>
            </div>

            <!-- The Invoice (This is what gets captured) -->
            <div id="invoice-preview" class="hidden bg-white p-8 rounded-lg shadow-md border border-gray-200">
                <div class="border-b-2 border-gray-800 pb-4 mb-6 flex justify-between items-end">
                    <div>
                        <h1 class="text-3xl font-extrabold text-gray-800">INVOICE</h1>
                        <p class="text-gray-500 mt-1" id="date-display"></p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-bold text-xl">Your Business Name</h3>
                        <p class="text-gray-500">Garment Wholesale</p>
                    </div>
                </div>

                <div class="mb-6">
                    <h4 class="text-gray-500 font-bold text-sm uppercase mb-1">Bill To:</h4>
                    <p class="text-xl font-bold text-gray-800" id="preview-name">-</p>
                </div>

                <table class="w-full mb-8 text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-3 font-bold text-gray-700 border-b">Item Description</th>
                            <th class="p-3 font-bold text-gray-700 border-b text-center">Qty</th>
                            <th class="p-3 font-bold text-gray-700 border-b text-right">Rate</th>
                            <th class="p-3 font-bold text-gray-700 border-b text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="p-3 border-b text-gray-800" id="preview-item">-</td>
                            <td class="p-3 border-b text-gray-800 text-center" id="preview-qty">0</td>
                            <td class="p-3 border-b text-gray-800 text-right" id="preview-price">₹0</td>
                            <td class="p-3 border-b text-gray-800 text-right" id="preview-item-total">₹0</td>
                        </tr>
                        <tr id="preview-charge-row" class="hidden">
                            <td class="p-3 border-b text-gray-800 italic" id="preview-charge-type">-</td>
                            <td class="p-3 border-b text-gray-800 text-center">-</td>
                            <td class="p-3 border-b text-gray-800 text-right">-</td>
                            <td class="p-3 border-b text-gray-800 text-right" id="preview-charge-amt">₹0</td>
                        </tr>
                    </tbody>
                </table>

                <div class="flex justify-end">
                    <div class="w-1/2">
                        <div class="flex justify-between py-2 font-bold text-2xl border-t-2 border-gray-800">
                            <span>Total Amount:</span>
                            <span id="preview-grand-total">₹0</span>
                        </div>
                    </div>
                </div>
                
                <div class="mt-12 text-center text-gray-400 text-sm">
                    Thank you for your business!
                </div>
            </div>

        </div>
    </div>

    <script>
        // Set up jsPDF
        window.jsPDF = window.jspdf.jsPDF;

        function generateBill() {
            // 1. Get values from inputs
            const purchaser = document.getElementById('purchaser').value;
            const item = document.getElementById('item').value;
            const qty = parseFloat(document.getElementById('qty').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const chargeType = document.getElementById('chargeType').value;
            const chargeAmount = parseFloat(document.getElementById('chargeAmount').value) || 0;

            // Basic validation
            if(!purchaser || !item) {
                alert("Please enter the Purchaser Name and Item Name.");
                return;
            }

            // 2. Calculate Totals
            const itemTotal = qty * price;
            const grandTotal = itemTotal + chargeAmount;

            // 3. Populate the Preview Section
            document.getElementById('date-display').innerText = "Date: " + new Date().toLocaleDateString();
            document.getElementById('preview-name').innerText = purchaser;
            document.getElementById('preview-item').innerText = item;
            document.getElementById('preview-qty').innerText = qty;
            document.getElementById('preview-price').innerText = "₹" + price.toFixed(2);
            document.getElementById('preview-item-total').innerText = "₹" + itemTotal.toFixed(2);
            document.getElementById('preview-grand-total').innerText = "₹" + grandTotal.toFixed(2);

            // Handle Additional Charges Row
            const chargeRow = document.getElementById('preview-charge-row');
            if (chargeType !== "None" && chargeAmount > 0) {
                document.getElementById('preview-charge-type').innerText = chargeType;
                document.getElementById('preview-charge-amt').innerText = "₹" + chargeAmount.toFixed(2);
                chargeRow.classList.remove('hidden');
            } else {
                chargeRow.classList.add('hidden');
            }

            // 4. Reveal the Preview and Export Buttons
            document.getElementById('invoice-preview').classList.remove('hidden');
            document.getElementById('export-controls').classList.remove('hidden');
            document.getElementById('export-controls').classList.add('flex');
        }

        function downloadImage() {
            const invoice = document.getElementById('invoice-preview');
            html2canvas(invoice, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Bill_' + document.getElementById('purchaser').value + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function downloadPDF() {
            const invoice = document.getElementById('invoice-preview');
            // Use html2canvas to take a high-res snapshot of the invoice div
            html2canvas(invoice, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                
                // Initialize jsPDF (Portrait, Millimeters, A4 format)
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                // Calculate dimensions to fit the image on the PDF page
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('Bill_' + document.getElementById('purchaser').value + '.pdf');
            });
        }
    </script>
</body>
  </html>
